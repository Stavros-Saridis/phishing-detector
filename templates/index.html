<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e1a; color: #e0e0e0; font-family: 'Courier New', monospace; }
        header { background: #0d1117; border-bottom: 1px solid #00ff88; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
        header h1 { color: #00ff88; font-size: 20px; letter-spacing: 2px; }
        .dot { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .scan-box { margin: 24px 32px; background: #0d1117; border: 1px solid #1e2a3a; border-radius: 8px; padding: 24px; }
        .scan-box h2 { color: #00ff88; font-size: 14px; letter-spacing: 2px; margin-bottom: 16px; }
        .input-row { display: flex; gap: 12px; }
        input[type="text"] { flex: 1; background: #0a0e1a; border: 1px solid #1e2a3a; border-radius: 6px; padding: 10px 16px; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #00ff88; }
        button { background: #00ff88; color: #0a0e1a; border: none; border-radius: 6px; padding: 10px 24px; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        button:hover { background: #00cc6a; }
        button:disabled { background: #1e2a3a; color: #888; cursor: not-allowed; }
        .status { margin-top: 12px; font-size: 13px; color: #888; }
        .result-box { margin: 0 32px 24px; background: #0d1117; border-radius: 8px; padding: 24px; display: none; }
        .result-box.show { display: block; }
        .score-row { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
        .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border: 3px solid; }
        .verdict { font-size: 20px; font-weight: bold; }
        .CRITICAL { color: #ff4444; border-color: #ff4444; }
        .HIGH { color: #ff8800; border-color: #ff8800; }
        .MEDIUM { color: #ffcc00; border-color: #ffcc00; }
        .LOW { color: #00ff88; border-color: #00ff88; }
        .warnings { margin-top: 16px; }
        .warnings h3 { color: #888; font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; }
        .warning-item { padding: 8px 12px; background: #0a0e1a; border-left: 3px solid #ff4444; margin-bottom: 6px; font-size: 13px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
        .info-card { background: #0a0e1a; border: 1px solid #1e2a3a; border-radius: 6px; padding: 12px; }
        .info-card h3 { color: #00ff88; font-size: 11px; letter-spacing: 1px; margin-bottom: 8px; }
        .info-item { font-size: 12px; color: #888; margin-bottom: 4px; }
        .info-item span { color: #e0e0e0; }
        .section { padding: 0 32px 32px; }
        .section h2 { color: #00ff88; font-size: 14px; letter-spacing: 2px; margin-bottom: 16px; border-bottom: 1px solid #1e2a3a; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #0d1117; color: #888; font-weight: normal; letter-spacing: 1px; padding: 10px 12px; text-align: left; border-bottom: 1px solid #1e2a3a; }
        td { padding: 10px 12px; border-bottom: 1px solid #1a1a2e; word-break: break-all; }
        tr:hover td { background: #0d1117; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-CRITICAL { background: #ff444422; color: #ff4444; border: 1px solid #ff4444; }
        .badge-HIGH { background: #ff880022; color: #ff8800; border: 1px solid #ff8800; }
        .badge-MEDIUM { background: #ffcc0022; color: #ffcc00; border: 1px solid #ffcc00; }
        .badge-LOW { background: #00ff8822; color: #00ff88; border: 1px solid #00ff88; }
    </style>
</head>
<body>
    <header>
        <div class="dot"></div>
        <h1>PHISHING DETECTOR</h1>
    </header>

    <div class="scan-box">
        <h2>SCAN URL</h2>
        <div class="input-row">
            <input type="text" id="url-input" placeholder="https://suspicious-site.com/login/verify" />
            <button id="scan-btn" onclick="scanUrl()">SCAN</button>
        </div>
        <div class="status" id="scan-status"></div>
    </div>

    <div class="result-box" id="result-box">
        <div class="score-row">
            <div class="score-circle" id="score-circle">0</div>
            <div>
                <div class="verdict" id="verdict"></div>
                <div style="color:#888; font-size:13px; margin-top:4px" id="result-url"></div>
            </div>
        </div>
        <div class="warnings" id="warnings-box"></div>
        <div class="info-grid" id="info-grid"></div>
    </div>

    <div class="section">
        <h2>SCAN HISTORY</h2>
        <table>
            <thead>
                <tr>
                    <th>TIMESTAMP</th>
                    <th>URL</th>
                    <th>SCORE</th>
                    <th>VERDICT</th>
                </tr>
            </thead>
            <tbody id="history-table"></tbody>
        </table>
    </div>

    <script>
        async function scanUrl() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) return;

            const btn = document.getElementById('scan-btn');
            btn.disabled = true;
            document.getElementById('scan-status').textContent = '[*] Scanning — checking URL, WHOIS, SSL...';
            document.getElementById('result-box').classList.remove('show');

            try {
                const res = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await res.json();
                showResult(data);
                loadHistory();
            } catch(e) {
                document.getElementById('scan-status').textContent = '[-] Error scanning URL';
            }

            btn.disabled = false;
            document.getElementById('scan-status').textContent = '';
        }

        function showResult(data) {
            const box = document.getElementById('result-box');
            box.classList.add('show');

            const circle = document.getElementById('score-circle');
            circle.textContent = data.risk_score;
            circle.className = `score-circle ${data.severity}`;

            document.getElementById('verdict').textContent = data.verdict;
            document.getElementById('verdict').className = `verdict ${data.severity}`;
            document.getElementById('result-url').textContent = data.url;

            const warningsBox = document.getElementById('warnings-box');
            if (data.warnings && data.warnings.length > 0) {
                warningsBox.innerHTML = `<h3>WARNINGS</h3>` +
                    data.warnings.map(w => `<div class="warning-item">[!] ${w}</div>`).join('');
            } else {
                warningsBox.innerHTML = '';
            }

            const infoGrid = document.getElementById('info-grid');
            const domainInfo = data.details?.domain_info || {};
            const sslInfo = data.details?.ssl_info || {};

            infoGrid.innerHTML = `
                <div class="info-card">
                    <h3>DOMAIN INFO</h3>
                    ${Object.entries(domainInfo).map(([k,v]) => `<div class="info-item">${k}: <span>${v}</span></div>`).join('') || '<div class="info-item">No data</div>'}
                </div>
                <div class="info-card">
                    <h3>SSL INFO</h3>
                    ${Object.entries(sslInfo).map(([k,v]) => `<div class="info-item">${k}: <span>${v}</span></div>`).join('') || '<div class="info-item">No data</div>'}
                </div>
            `;
        }

        async function loadHistory() {
            const res = await fetch('/api/history');
            const scans = await res.json();
            const tbody = document.getElementById('history-table');
            tbody.innerHTML = scans.map(s => `
                <tr>
                    <td>${s.timestamp}</td>
                    <td>${s.url}</td>
                    <td>${s.risk_score}/100</td>
                    <td><span class="badge badge-${s.severity}">${s.verdict}</span></td>
                </tr>
            `).join('');
        }

        document.getElementById('url-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') scanUrl();
        });

        loadHistory();
    </script>
</body>
</html>
